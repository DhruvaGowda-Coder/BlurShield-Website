<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070a10">
  <title>Purchase complete — BlurShield</title>
  <style>
    * { box-sizing:border-box; }
    :root { color-scheme:dark; --bg:#070a10; --card:#10151e; --line:#263241; --text:#f2f6fb; --muted:#9aa9ba; --green:#21c997; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 50% 0%,#12312c 0,var(--bg) 48%); }
    main { width:min(100%,560px); padding:44px; text-align:center; background:rgba(16,21,30,.94); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 80px rgba(0,0,0,.35); }
    img { border-radius:16px; }
    .check { width:54px; height:54px; display:grid; place-items:center; margin:24px auto; border-radius:50%; background:rgba(33,201,151,.14); color:var(--green); font-size:30px; }
    h1 { margin:0 0 14px; font-size:34px; }
    p { color:var(--muted); line-height:1.65; }
    a { display:inline-block; margin-top:18px; padding:12px 16px; border:1px solid var(--line); border-radius:10px; color:var(--text); text-decoration:none; font-weight:700; }
    a:hover { border-color:var(--green); }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon128.png" width="64" height="64" alt="BlurShield logo">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Purchase complete</h1>
    <p>BlurShield is activating your license in the extension. You can close this tab and return to BlurShield Settings. If activation does not appear, use the license key from your purchase email.</p>
    <a href="contact.html">Get support</a>
  </main>
</body>
</html>
